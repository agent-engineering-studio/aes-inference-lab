<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AES Inference Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%F0%9F%90%A6</text></svg>">
  <script src="{{ root }}/static/htmx.min.js" defer></script>
</head>
<body data-root="{{ root }}">
<div class="wrap">
  <div class="top">
    <h1>AES Inference Lab</h1>
    <span class="sub">test bench for local inference servers</span>
    <span class="spacer"></span>
    <button class="ghost sm" id="theme-toggle" type="button">theme</button>
    <a class="eyebrow" href="{{ root }}/docs" style="color:var(--amber);text-decoration:none">API&nbsp;↗</a>
  </div>
  {% block content %}{% endblock %}
  <footer class="foot">
    AES Inference Lab · dashboard and benchmarks for colibrì, llama.cpp and LiteLLM ·
    all times are measured client-side, from the HTTP request to the token.
  </footer>
</div>
<script src="{{ root }}/static/app.js"></script>
</body>
</html>
