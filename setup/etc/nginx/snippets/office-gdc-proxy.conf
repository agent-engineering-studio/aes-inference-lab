# Intestazioni e timeout comuni ai backend di office-gdc.w3pro.it.
#
# Va incluso DENTRO ogni location, non a livello server: nginx non eredita
# le proxy_set_header dal blocco superiore se la location ne dichiara una
# propria, e basta una singola direttiva per perderle tutte.
#
# Installazione: /etc/nginx/snippets/office-gdc-proxy.conf

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme e non 'https' fisso: sul blocco :80 il valore deve restare http,
# altrimenti l'applicazione costruisce redirect verso uno schema sbagliato.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket: hot reload di Vite, e SignalR se serve. La map
# $connection_upgrade sta in /etc/nginx/conf.d/upgrade.conf e vale "close"
# quando il client non chiede un upgrade, cosi' le richieste normali non
# portano un Connection: upgrade improprio.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 60s;
proxy_send_timeout    300s;
proxy_cache off;

# proxy_read_timeout NON sta qui: e' a valore singolo, nginx rifiuta la
# configurazione se una location lo ridichiara dopo l'include. Ogni
# location imposta il proprio, che e' anche giusto: i backend hanno tempi
# di risposta molto diversi.
