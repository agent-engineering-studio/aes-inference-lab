# La page cache È la cache degli esperti di colibrì: proteggila.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# colibri mappa molti shard contemporaneamente.
vm.max_map_count = 1048576

# Evita che i write burst sui meccanici blocchino i read su NVMe.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
