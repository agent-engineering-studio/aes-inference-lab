# LiteLLM — gateway unico. I tre progetti puntano tutti qui e scelgono
# per NOME MODELLO. Serve perche' limen e knowledge-graph accettano un
# solo base_url: senza gateway non potresti mandare un ruolo a colibri
# e un altro a llama-swap.

model_list:
  - model_name: fast
    litellm_params:
      model: openai/chat-4b
      api_base: http://127.0.0.1:${PORT_LLAMA_SWAP}/v1
      api_key: dummy

  - model_name: chat
    litellm_params:
      model: openai/chat-8b
      api_base: http://127.0.0.1:${PORT_LLAMA_SWAP}/v1
      api_key: dummy

  - model_name: extract
    litellm_params:
      model: openai/extract-4b
      api_base: http://127.0.0.1:${PORT_LLAMA_SWAP}/v1
      api_key: dummy

  - model_name: embed
    litellm_params:
      model: openai/embed
      api_base: http://127.0.0.1:${PORT_EMBED}/v1
      api_key: dummy

  # ── Tier qualita', opzione A: locale ──────────────────────
  - model_name: quality-local
    litellm_params:
      model: openai/glm52
      api_base: http://127.0.0.1:${PORT_COLIBRI}/v1
      # colibri ora richiede una chiave: 'dummy' prenderebbe 401.
      # Il valore arriva dall'ambiente della unit, che legge il file dei
      # segreti condiviso (SECRETS_FILE, 0640 root:inference): non e' scritto
      # qui dentro, perche' questo config e' 0644.
      api_key: os.environ/COLI_API_KEY
      timeout: 5400        # 90 min: un report da 4k token a ~1,5 tok/s

  # colibri per nome proprio, SENZA fallback. La differenza con
  # quality-local non e' il modello ma la semantica del guasto: se colibri
  # non risponde, quality-local ti da' Claude e tu non te ne accorgi, glm52
  # ti da' un errore. Serve a chi vuole *questo* modello — un confronto fra
  # modelli, una valutazione, un test di regressione — dove ricevere in
  # silenzio le risposte di un altro modello invalida il risultato.
  #
  # Nessuna voce in router_settings.fallbacks qui sotto: e' l'omissione che
  # implementa il comportamento.
  - model_name: glm52
    litellm_params:
      model: openai/glm52
      api_base: http://127.0.0.1:${PORT_COLIBRI}/v1
      api_key: os.environ/COLI_API_KEY
      timeout: 5400

  # ── Tier qualita', opzione B: Claude ──────────────────────
  # Attivo solo se ANTHROPIC_API_KEY e' valorizzata in /etc/litellm/env
  # (0600), il file dei segreti del solo gateway.
  - model_name: quality-cloud
    litellm_params:
      model: ${LITELLM_CLOUD_MODEL}
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  fallbacks:
    - quality-local: ["quality-cloud"]

litellm_settings:
  # Un job schedulato che entra in loop su un endpoint a pagamento e' il
  # modo piu' comune di scoprire il proprio limite di carta di credito.
  max_budget: ${LITELLM_MAX_BUDGET}
  budget_duration: ${LITELLM_BUDGET_DURATION}
  drop_params: true
