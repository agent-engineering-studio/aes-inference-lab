# Sovrapposizione facoltativa: dà al container accesso a nvidia-smi
# per mostrare uso e temperatura della scheda video.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Richiede nvidia-container-toolkit installato sull'host.
services:
  lab:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
