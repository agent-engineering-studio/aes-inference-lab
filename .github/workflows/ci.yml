name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aes-inference-lab:ci .
      - name: la dashboard risponde
        run: |
          docker run -d --name lab -p 8500:8500 aes-inference-lab:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8500/healthz && exit 0
            sleep 2
          done
          docker logs lab
          exit 1
