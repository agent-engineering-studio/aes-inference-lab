name: aes-inference-lab

services:
  lab:
    build: .
    image: aes-inference-lab:latest
    container_name: inference-lab
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LAB_CONFIG: config/endpoints.yml
      LAB_DB_PATH: /app/data/lab.sqlite3
      # Prefisso servito dal reverse proxy: "/inference" dietro nginx,
      # vuoto se la dashboard sta sulla radice del dominio.
      LAB_ROOT_PATH: ${LAB_ROOT_PATH:-}
      # IP da cui uvicorn accetta gli header X-Forwarded-*: e' il gateway della
      # rete bridge, l'indirizzo con cui nginx arriva al container.
      FORWARDED_ALLOW_IPS: ${LAB_FORWARDED_ALLOW_IPS:-127.0.0.1}
      HOST_PROC: /host/proc
      MODELS_PATH: ${MODELS_PATH:-/srv/models}
    ports:
      - "${LAB_PORT:-8500}:8500"
    volumes:
      - ./config:/app/config:ro
      - lab-data:/app/data
      # per leggere RAM e page cache dell'host anziché del container
      - /proc:/host/proc:ro
      # per mostrare lo spazio libero dove risiedono i modelli (sola lettura)
      - ${MODELS_PATH:-/srv/models}:${MODELS_PATH:-/srv/models}:ro
    extra_hosts:
      # Da' un nome all'host (risolve nel gateway del bridge di default).
      # ATTENZIONE: non basta a raggiungere i motori. Devono ascoltare su
      # 0.0.0.0 -- un socket su 127.0.0.1 non e' raggiungibile da qui -- e ufw
      # deve consentire il traffico dai bridge docker verso l'host, perche' con
      # DEFAULT_INPUT_POLICY=DROP quei pacchetti finiscono in INPUT e cadono.
      # Le porte pubblicate da altri container passano invece per le catene di
      # docker e non sono soggette a questa regola.
      - "host.docker.internal:host-gateway"
    # Limiti prudenti: la dashboard non deve rubare page cache al motore.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Motore simulato per provare la dashboard senza il server reale:
  #   docker compose --profile demo up
  mock:
    build: .
    image: aes-inference-lab:latest
    container_name: inference-lab-mock
    profiles: ["demo"]
    restart: unless-stopped
    command: ["uvicorn", "mock.server:app", "--host", "0.0.0.0", "--port", "9000"]
    expose:
      - "9000"
    ports:
      - "${MOCK_PORT:-9000}:9000"

volumes:
  lab-data:

networks:
  # Subnet fissata di proposito. Con l'assegnazione automatica la rete
  # cambia indirizzo (e il bridge cambia nome) a ogni ricreazione, e la
  # regola ufw che autorizza il container a raggiungere i motori
  # sull'host smetterebbe di combaciare senza dare errore.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
